name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # 正常 8–12 分钟；有测试卡住（无限循环 + advanceUntilIdle 之类）时 30 分钟后失败，不再空跑几小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        # NDK / CMake 给 :feature-flashing 的原生构建用（与本地一致：27.2.12479018 / 3.22.1）。
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install CJK fonts for screenshot tests
        # 上一轮 `apt-get update` 在这台 runner 上卡了 44 分钟（镜像源慢），所以先直接装；
        # runner 镜像一般已带 apt 索引，缺索引时再更新一次。
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk)
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # 仓库导入后工具搬到了 tools/modbus/ 下；原来指 tools/rtu_lab 会让 setup-python 直接失败。
          cache-dependency-path: tools/modbus/rtu_lab/requirements.txt
      - name: Test local virtual serial RTU lab
        run: |
          python -m pip install -r tools/modbus/rtu_lab/requirements.txt
          python -m unittest discover -s tools/modbus/rtu_lab/tests -v
      - name: Test, lint, assemble, and record screenshots
        # 根工程把两个旧仓库并成 6 个模块：两个纯 JVM core、两个 feature、:ui-common、:app。
        # 旧 CI 只跑 :app 的 test/lint，feature 模块的 968 个单测会漏掉。
        run: >
          ./gradlew
          :modbus-core:test
          :flashing-core:test
          :feature-modbus:testDebugUnitTest
          :feature-flashing:testDebugUnitTest
          :app:testDebugUnitTest
          :app:recordRoborazziDebug
          :feature-modbus:recordRoborazziDebug
          :app:lintDebug
          :feature-modbus:lintDebug
          :feature-flashing:lintDebug
          :app:assembleDebug
          :app:assembleRelease
      - name: Verify debug bridge stays out of release
        run: python tools/modbus/verify_offline_apks.py
      - name: Reject INTERNET permission
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find app/build/intermediates/merged_manifests -name AndroidManifest.xml)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "INTERNET permission found in $manifest"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: |
            app/src/test/screenshots/**/*.png
            feature-modbus/src/test/screenshots/**/*.png
          if-no-files-found: error
