name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - name: Install CJK fonts for screenshot tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, assemble, and record screenshots
        run: ./gradlew :modbus-core:test :app:testDebugUnitTest :app:recordRoborazziDebug :app:lintDebug :app:assembleDebug
      - name: Reject INTERNET permission
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            if grep -q 'android.permission.INTERNET' "$manifest"; then
              echo "INTERNET permission found in $manifest"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/src/test/screenshots/**/*.png
          if-no-files-found: error
